<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoinPeas — top 100 coins by market cap</title>
  <meta name="description" content="Top 100 coins by market cap. Efficient, as far as is possible and practicable." />
  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles.css" />
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var stored = localStorage.getItem('coinpeas-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        document.documentElement.setAttribute('data-theme-pref', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
