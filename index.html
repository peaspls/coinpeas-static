<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoinPeas — top 50 coins by market cap</title>
  <meta name="description" content="Top 50 coins by market cap. Efficient, as far as is possible and practicable." />
  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles.css" />
  <script>
    // Applied before first paint to avoid a flash of the wrong theme or season.
    (function () {
      try {
        var now = new Date(), y = now.getFullYear(), m = now.getMonth();
        // Daylight saving in January means the southern hemisphere.
        if (new Date(y, 0).getTimezoneOffset() < new Date(y, 6).getTimezoneOffset()) m += 6;
        var forced = /[?&]season=(\w+)/.exec(location.search);
        document.documentElement.setAttribute('data-season', forced ? forced[1] : ['winter', 'spring', 'summer', 'autumn'][(m + 1) % 12 / 3 | 0]);
        var stored = localStorage.getItem('coinpeas-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        document.documentElement.setAttribute('data-theme-pref', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
