name: Update coin data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: update-coins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # dist/ only needs rebuilding when the app itself changes, not
      # when coins.json changes (that happens on almost every run).
      - id: dist-cache
        uses: actions/cache@v6
        with:
          path: dist
          key: dist-${{ hashFiles('index.html', 'src/**', 'public/_headers', 'package-lock.json') }}

      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: npm ci

      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build

      - run: |
          if [ -n "$COINGECKO_API_KEY" ]; then
            echo "Using COINGECKO_API_KEY for this request."
          else
            echo "No COINGECKO_API_KEY set — using CoinGecko's public rate limits."
          fi
          npm run fetch-coins
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # Skipped until the CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets
      # are set up — set the DEPLOY_ENABLED repo variable to "true" once
      # they're in place. Without this, every scheduled run would fail at
      # this step (missing secrets resolve to an empty string, not an
      # error) for as long as the secrets are missing.
      - if: vars.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          wranglerVersion: "4.132.0"

      - if: vars.DEPLOY_ENABLED != 'true'
        run: |
          echo "::notice title=Deploy skipped::DEPLOY_ENABLED is not set to 'true' — the Cloudflare deploy step was skipped this run."
          echo "⚠️ Deploy skipped — \`DEPLOY_ENABLED\` repo variable is not set to \`true\`." >> "$GITHUB_STEP_SUMMARY"
